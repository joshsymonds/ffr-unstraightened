# Queering lens. Makes a character outside the core cast's romance queer, and splits the party flirt's running gag.
# Keeps the core cast's sexuality and romances as written, and keeps the sincere threads.
# Each screen criterion and each intent/judge paragraph starts with its [label].

base = "unstraightening"
selection = "queering"
romance_share = 15
world_share = 10
nonbinary_share = 5
trans_share = 5

[[triage]]
id = "romance"
question = "A character outside the core cast in this scene refers to their own partner or a romantic interest of any sort: a partner, a crush, someone they are attracted to, flirting or romantic pursuit."

[[triage]]
id = "gender-roles"
question = "A line in this scene is about what men or women are, may do or should do."

[[triage]]
id = "flirt-at-woman"
question = "The party member whose running gag is flirting aims a running-gag flirt in this scene only at a woman or at women."

[screen]
model = "opus"
criteria = [
    "[romance] Flag romance when a character outside the core cast refers to their own partner or a romantic interest of any sort: a partner, a crush, someone they are attracted to, flirting or romantic pursuit. Any character outside the core cast qualifies, a bigger recurring one as much as a passer-by. Flag only the speaker's own lines.",
    "[gender-roles] Flag gender-roles when a line is about what men or women are, may do or should do. Tracking only: a gender-roles flag never selects a speaker or a line.",
    "[not-core-cast] Never flag a core-cast line, with one exception: the flirt, the one speaker whose cast entry carries \"flirt\": true. Flag the flirt's running-gag flirts aimed only at a woman or women under flirt-at-woman. Never flag the flirt's sincere thread. Never flag a flirt aimed at a minor or a child-looking character. The core cast is the recurring party members, not a minor character.",
]

[intent]
rule = """
You rewrite only the lines you are given: every romance line of a speaker chosen queer, drafted together; a line in the flirt's redirect half; one candidate line of a world pick; one candidate line of a nonbinary pick; or one candidate line of a trans pick. Change only what the bucket or the flirt rule asks, and keep the story. Keep a line unchanged only for a reason from this keep list: no-hit when the line is not the shape its label names, protection when a protect rule below covers it, or plot when the partner appears or is named as a character elsewhere in the given context, or when the change would alter what happens.

[minimal-fix] Change only the words the edit needs. Leave the rest of the line as written. Do not rewrite a whole line when one word or one clause carries the change. The world, nonbinary and trans buckets' own edit is allowed here.

[same-partner] When a speaker has several romance lines in a queer pick, they are drafted together. Use the same partner in every line, with one gender, one set of pronouns and the same details.

[queer-bucket] For the queer bucket, the speaker's romantic target becomes the same sex. Swap the gender of the partner or crush so the pairing is same-sex. For a man or woman speaker, the pursuit target changes gender too. Where the line can carry both a same-sex and an opposite-sex reading, a bi reading is fine. Keep everything else: the feeling, the bond and the details.

[world-bucket] For a world pick, change one candidate line of the speaker: add a short same-sex partner mention, worked into a line already about the speaker's home, family, work or daily life. The partner must carry the line's point, so that deleting the mention would lose something. Put it in one short clause, with no labels and no explaining. Change no other line.

[nonbinary-bucket] For a nonbinary pick, change one candidate line of the speaker: add a short mention of a specific partner, either "my partner" or a name the line already allows, consistently called they/them wherever gender would otherwise show. The mention is worked into a line already about the speaker's home, family, work or daily life, a line where the partner's gender would otherwise show. The partner must carry the line's point, so that deleting the mention would lose something. Put it in one short clause, with no labels and no explaining. Change no other line.

[trans-bucket] For a trans pick, change at most one candidate line of the speaker. Where the line naturally allows it, add one light, natural trans detail of one of four shapes: acceptance (a family member's acceptance, possibly in progress); backing (someone who backs the speaker); chosen-name (a name the speaker chose and likes); or present-life (ordinary present life with the speaker's gender a given). The detail must be recognizable as trans and must answer the line's own topic. Where the line does not allow it, keep it unchanged as no-hit. The detail is never forced. Never write a "she's trans" aside.

[already-queer] A line whose pairing is already same-sex stays as written, and so does a line whose speaker, partner or crush is already trans or nonbinary. Keep these lines unchanged as no-hit.

[flirt-redirect] For a line in the flirt's redirect half, redirect the flirt to a man present in the scene. Which of his running-gag lines are in that half is decided before drafting, by key hash.

[generalize-when-reaction] When the woman's reaction is in the same scene, generalize the address instead, for example to all genders.

[protect-sincere-thread] Never touch the flirt's sincere thread.

[protect-minor-target] Never touch a flirt aimed at a minor or a child-looking character.

[protect-core-cast] Do not change the core cast's sexuality or romances beyond the flirt's split.

[no-gender-joke-or-menace] The queerness is never the joke or the threat. Do not write a line whose humor or menace rests on a character's gender or queerness.

[no-explaining] Do not explain the change in the line, and do not add a tokenistic detail. The world, nonbinary and trans buckets' own edit is neither an explanation nor a tokenistic detail.

[keep-voice] Keep the speaker's voice: their word choice, rhythm and manner.

[no-new-detail] Add no name, object or motive the original line lacks, except the world, nonbinary and trans buckets' own edit.

[no-contradiction] Keep the rewrite consistent with the speaker's other lines.

[protect-plot] Keep every plot fact: what happens, who does what, and the decisions made. A pick's partner or crush gender is the bucket's edit, never a plot fact by itself. Keep a line unchanged for plot only when that partner appears or is named as a character elsewhere in the given context, or when the change would alter what happens. Leave a line alone when fixing it needs a plot change.
"""

[judge]
rubric = """
You judge one rewritten line against its original and the label it was drafted under. Reject the rewrite when it breaks any label below.

[meaning] meaning protects the bond, not the gender. The same partner, feeling and details stay. The partner's or crush's gender, or the flirt's target, changes only as the bucket asks.

[minimal-fix] Reject a rewrite that changes more than its edit needs. The world, nonbinary and trans buckets' own edit is allowed here.

[same-partner] Reject a rewrite that changes the partner's gender, pronouns or details from one of the speaker's lines to another.

[queer-bucket] Reject a rewrite that changes more than the target's gender, or that leaves the pairing other than same-sex unless the line carries a bi reading.

[world-bucket] Reject a rewrite that adds a same-sex partner mention which could be deleted without loss. Reject a rewrite that changes more than one line of a world, nonbinary or trans pick. Reject a rewrite that is not one short clause, or that puts a label or an explanation in the line.

[nonbinary-bucket] Reject a rewrite whose they/them reads as merely unspecified gender, where the partner is not a specific person or the they/them is not used consistently wherever gender would otherwise show. Reject a rewrite that uses the word nonbinary or any modern label (trans, transgender, transition, deadname) in the setting. Reject a rewrite whose partner mention could be deleted without loss. Reject a rewrite that is not one short clause, or that puts a label or an explanation in the line.

[trans-bucket] Reject a "she's trans" aside. Reject a rewrite that forces a trans detail the line does not naturally allow. A light, natural trans detail is the bucket's edit only when it is one of the four shapes and answers the line's own topic. The four shapes are acceptance (a family member's acceptance, possibly in progress), backing (someone who backs the speaker), chosen-name (a name the speaker chose and likes) and present-life (ordinary present life with the speaker's gender a given). Reject a rewrite whose trans detail is too vague to read as trans. Reject a rewrite that states an old name. Reject a rewrite that volunteers transition history to a stranger. Reject a rewrite with body or medical talk. Reject a rewrite where pain is the whole story. Reject a rewrite that frames being trans as a secret or concealment. Reject a rewrite that uses a modern label (trans, transgender, transition, nonbinary, deadname) in the setting. Reject a rewrite that makes the player the validator or the rescuer. Reject a rewrite that makes a joke at the speaker's expense.

[already-queer] Reject a rewrite that changes a line whose pairing is already same-sex, or whose speaker, partner or crush is already trans or nonbinary.

[flirt-redirect] Reject a rewrite that redirects the flirt to anyone but a man present in the scene, unless generalize-when-reaction applies.

[generalize-when-reaction] Reject a rewrite that does not generalize the address when the woman's reaction is in the same scene.

[protect-sincere-thread] Reject a rewrite that touches the flirt's sincere thread.

[protect-minor-target] Reject a rewrite that touches a flirt aimed at a minor or a child-looking character.

[protect-core-cast] Reject a rewrite that changes the core cast's sexuality or romances beyond the flirt's split.

[no-gender-joke-or-menace] Reject a rewrite whose humor or menace rests on the target's or partner's gender or queerness.

[no-explaining] Reject a rewrite that explains the change or adds a tokenistic detail. The world, nonbinary and trans buckets' own edit is neither an explanation nor a tokenistic detail.

[keep-voice] Reject a rewrite that breaks the speaker's voice.

[no-new-detail] Reject a rewrite that adds a name, object or motive the original line lacks, except the world, nonbinary and trans buckets' own edit.

[no-contradiction] Reject a rewrite that contradicts the speaker's other lines.

[protect-plot] Reject a rewrite that changes a plot fact, or that changes the scene's meaning to fit a label. A pick's partner or crush gender is not a plot fact by itself, unless that partner appears or is named as a character elsewhere in the given context.

[fixed] fixed means the bucket's edit is present and legible. For a queer pick, the partner or crush is now same-sex. For a redirect, the flirt now aims at a man present in the scene, or its address is generalized. A redirect whose flirt still aims only at a woman is not fixed. For a world pick, a same-sex partner mention is present. For a nonbinary pick, a specific partner is referred to with they/them at least once. "my partner" with no they/them leaves the gender unspecified and is not fixed. For a trans pick, the line carries one of the four shapes. A rewording that adds or changes no gender content is not fixed. Reject a rewrite that leaves its bucket's edit absent or not legible.

[no-invention] Reject a rewrite that adds a name, person or fact that neither the line nor its context holds, beyond the bucket's own edit, or that swaps a name for another. A partner mention names no one new. The chosen-name shape may give only the speaker's own chosen name.

[keep-point] Reject a rewrite that loses the line's point (its joke, its purpose in the scene, or what it shows of the speaker). The bucket's edit rides on the point and never replaces it. A gag rewritten into a line about something else has lost its point.

[fits-the-moment] Read the whole scene. Reject a rewrite whose added or changed queer detail could not naturally come up in what the scene is already doing, for any speaker, hero or villain. A detail that rides on what the speaker is already doing fits, such as a flirt widened while the speaker is flirting. A partner aside, crush or identity detail dropped into a battle, a threat, a confrontation, a chase or plot exposition derails the scene and does not fit, and neither does a change to a loss or grief that drives the scene. A villain on screen to be villainous gets no queer detail unless the scene is plain downtime: rest, a meal, or a reflective aside away from any confrontation.
"""
