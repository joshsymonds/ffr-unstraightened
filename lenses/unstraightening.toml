# Unstraightening lens. Keeps the game's plot, relationships, traits and operatic stakes,
# and dials back compulsory romance framing, earnest melodrama and gender rules.
# Each rule, refinement and protection starts with its label in square brackets.

[[triage]]
id = "u1-presumed-opposite-sex"
question = "A character in this scene assumes that another character's partner or future partner is of the opposite sex, or treats closeness between two characters of the same sex as a joke, an insult or a threat."

[[triage]]
id = "u2-romance-outranks"
question = "A character in this scene says or implies that a romantic feeling matters more than a duty, a friendship, their own life, or the fate of other people."

[[triage]]
id = "u3-devotion-as-vow"
question = "A character in this scene describes devotion to a romantic partner as a sacred vow, fate, or giving up their own self."

[[triage]]
id = "u4-stake-through-other"
question = "A character in this scene explains their own goal, fear or worth in terms of what another specific character thinks of them or needs from them."

[[triage]]
id = "u5-rivalry-over-one-person"
question = "Two characters in this scene compete or quarrel over the affection or attention of one other character."

[[triage]]
id = "u6-overwrought-declaration"
question = "A character in this scene declares romantic love or longing in extreme, breathless or life-or-death terms."

[[triage]]
id = "u7-gender-rule"
question = "A line in this scene states what men or women may do, must do, or are like."

[screen]
criteria = [
    "[u1-presumed-opposite-sex] Flag u1-presumed-opposite-sex when a character presumes that another character's partner or future partner is of the opposite sex, or when a line treats closeness between two characters of the same sex as a joke, an insult or a threat. Flag the presumption made about another character. Do not flag the sentiment itself, and do not flag a character's own wish for an opposite-sex partner (see first-person-desire).",
    "[u2-romance-outranks] Flag u2-romance-outranks when a character says or implies that a romantic feeling matters more than a duty, a friendship, their own life, or the fate of other people. Flag it broadly: do not decide whether the feeling is earned. The intent and judge stages decide that from the arc beats.",
    "[u3-devotion-as-vow] Flag u3-devotion-as-vow when a character describes devotion to a romantic partner or love interest as a sacred vow, as fate, or as giving up their own self. Oaths to lords, causes and comrades are not flagged here (see romantic-partner-only).",
    "[u4-stake-through-other] Flag u4-stake-through-other when a line about a woman explains her own goal, fear or worth in terms of what a specific man thinks of her or needs from her. The cast notes give each character's gender. This criterion covers only a woman whose stake runs through a man.",
    "[u5-rivalry-over-one-person] Flag u5-rivalry-over-one-person when two women in the scene compete or quarrel over the affection or attention of one man. The cast notes give each character's gender. This criterion covers only two women rivaling over a man.",
    "[u6-overwrought-declaration] Flag u6-overwrought-declaration when a character declares romantic love or longing in extreme, breathless or life-or-death terms. Flag it broadly: do not decide whether the declaration is earned. The intent and judge stages decide that from the arc beats.",
    "[u7-gender-rule] Flag u7-gender-rule when a line states or plainly implies what men or women may do, must do, or are like, including a gendered expectation such as who may fight, being a man, or acting like a girl.",
    "[first-person-desire] A character's own wish for an opposite-sex partner is protected. When a character voices their own desire, do not flag it under u1-presumed-opposite-sex. Only another character presuming that partner is flagged.",
    "[romantic-partner-only] u3-devotion-as-vow covers devotion to a romantic partner or love interest only. Oaths to lords, causes and comrades are untouched and must not be flagged under u3-devotion-as-vow.",
    "[gender-rule-narrow] u7-gender-rule is narrow. Do not flag a line in which a character is vulnerable or protective, even when the line mentions a gender. Flag only a line that states or plainly implies what men or women may do, must do, or are like, including a gendered expectation such as who may fight, being a man, or acting like a girl.",
    "[romance-as-default] Flag under u2-romance-outranks a line that treats romance as the default frame, such as being unpartnered as incomplete or marriage as what a life is for. Flag it broadly: the intent and judge stages apply the same earned and established-trait exemptions as for u2-romance-outranks.",
    "[all-characters] The romance rules u1-presumed-opposite-sex, u2-romance-outranks, u3-devotion-as-vow and u6-overwrought-declaration, and the romance-as-default framing, apply to every character's romance framing, men's as well as women's, not only women's. The woman and man clauses of u4-stake-through-other and u5-rivalry-over-one-person are stated in their own criteria.",
    "[act-on-clear-hits] Flag every line that clearly hits a rule above, including a brief or mild hit and a hit inside an otherwise ordinary line. Do not leave a hit unflagged because it seems minor or because the intent stage may keep it: the intent and judge stages apply the exemptions. When a line plausibly hits a rule and you are unsure whether an exemption or protection covers it, flag it: the intent and judge stages decide, and every protection still holds there. A line with no hit stays unflagged, whatever its tone.",
    "[protect-love-and-couples] Heterosexual attraction, couples, marriages, promises, and who loves whom are protected. Do not flag a line only because it states that two characters are a couple, that a marriage or promise exists, that a character is attracted to someone of the opposite sex, or who loves whom. Only the rules above flag a line.",
    "[protect-mutual-support] Characters supporting themselves or each other is never a defect, whatever their genders. A character relying on, helping, encouraging or drawing strength from another character, is protected, and this protection wins over every rule above, u4-stake-through-other included. Do not flag such a line.",
    "[protect-plot] Plot facts are protected: what happens, who does what, the decisions characters make, and the events of the scene. Do not flag a line in order to change a plot fact, and do not flag a line whose only defect would be fixed by changing one.",
    "[protect-traits] Character traits are protected, including a character's own straight desire and a flirt's flirting. Flag the framing of a romance, never the trait itself. A flirt stays a flirt.",
    "[protect-operatic-stakes] The game's operatic non-romance stakes are protected: grand destinies, the fate of the world, battles, duty and sacrifice for a cause, and oaths to lords, causes and comrades. Do not flag a line because its stakes are large or its tone is grand.",
    "[protect-earned-declarations] An earned declaration the story builds to is protected. A declaration is earned when the arc beats record a setup and an escalation beat between the same characters before the declaration, or the stance is the speaker's established trait. The screen sees one line at a time, so flag such a line under u2-romance-outranks or u6-overwrought-declaration as usual and leave the earned decision to the intent and judge stages.",
    "[protect-affectionate-teasing] Affectionate teasing that does not treat same-sex attraction as shameful is protected. Do not flag teasing under u1-presumed-opposite-sex unless it treats closeness between two characters of the same sex as a joke, an insult or a threat.",
    "[exclude-queer-additions] Do not flag a line in order to add a new romance, to add a queer addition, or to retarget a flirt. Those changes are out of scope.",
    "[exclude-clumsy-lines] A clumsy, awkward or stilted line with none of the triggers above is out of scope. Do not flag it.",
]

[intent]
rule = """
You fix only the lines the screen flagged under the triage ids. Change every flagged line that clearly hits a rule, change each one minimally, and fully fix it. Keep the original story.

[act-on-clear-hits] Rewrite a flagged line whenever it clearly hits the rule it is flagged under. Do not keep a clear hit vanilla because the hit is mild or brief, because the line is otherwise ordinary, or because leaving it is safer. The screen already found a hit, so start from rewriting: keep the line only when you can name the specific reason from the list that follows that the line meets. A doubt alone is not a reason to keep. Keep a flagged line unchanged only when it does not actually hit the rule, when an exemption below applies (earned, no-invented-motive, gender-rule-narrow, a character's own wish for an opposite-sex partner, oaths outside romance), when every fix would touch a protection or exclusion below (the protect and exclude rules always win), or when fixing it needs a plot change (leave-for-plot).

[minimal-fix] Change each rewritten line minimally: change only the words the fix needs, keep the rest of the line, and fix only the flagged line, never its neighbors. Each rewritten line must be fully fixed. A partial fix that leaves the flagged trigger in place is not a fix.

[u1-presumed-opposite-sex] For a presumption that another character's partner or future partner is of the opposite sex, or for closeness between two characters of the same sex treated as a joke, an insult or a threat: remove the presumption, keep the sentiment, and make no one queer. Do not add a new romance.

[u2-romance-outranks] For a romantic feeling said to matter more than a duty, a friendship, the speaker's own life, or the fate of other people: keep the feeling and size it to the moment. Also fix romance-as-default framing the same way: being unpartnered is not presented as incomplete, and marriage is not presented as what a life is for, unless the line is earned or the stance is the speaker's established trait. Leave the line unchanged when the earned test below is met.

[earned] For u2-romance-outranks, u6-overwrought-declaration and the romance-as-default framing, a declaration or stance is earned when the arc beats in your context record a setup and an escalation beat between the same characters before the declaration, or when the stance is the speaker's established trait. An earned line is left unchanged. Fix only lines that are not earned.

[u3-devotion-as-vow] For devotion to a romantic partner or love interest described as a sacred vow, as fate, or as giving up the speaker's own self: make it a choice between equals, with the same commitment and the same action. Oaths to lords, causes and comrades are not in scope.

[u4-stake-through-other] For a woman's own goal, fear or worth routed through a man when the line is about her: return the stake to her, so that the goal, fear or worth is hers.

[u5-rivalry-over-one-person] For two women competing or quarreling over a man: keep the tension and make it about them, not about the man.

[no-invented-motive] For a u5-rivalry-over-one-person line, when the scene offers no other motive for the tension, the line stays vanilla. Do not add an invented motive.

[u6-overwrought-declaration] For an unearned romantic declaration in extreme, breathless or life-or-death terms: write it in an adult register and keep its sentiment.

[u7-gender-rule] For a line that states or plainly implies what men or women may do, must do, or are like, including a gendered expectation such as who may fight, being a man, or acting like a girl: make it neutral. Never change a line in which a character is vulnerable or protective, even when it mentions a gender.

[leave-for-plot] A flagged line that can be fixed only by changing a plot fact stays vanilla. Do not change the plot to make a fix work.

[protect-love-and-couples] Do not change heterosexual attraction, couples, marriages, promises, or who loves whom. Fix only the presumption, framing or rule the flag names.

[protect-mutual-support] Characters supporting themselves or each other is never a defect, whatever their genders. A character relying on, helping, encouraging or drawing strength from another character, is protected. This protection wins over every rule, u4-stake-through-other included: keep such a line unchanged.

[protect-plot] Do not change plot facts: what happens, who does what, the decisions characters make, or the events of the scene.

[protect-traits] Keep character traits, including a character's own straight desire. A flirt stays a flirt. A character's own wish for an opposite-sex partner is not changed; the u1-presumed-opposite-sex fix targets only a presumption imposed on another character. Change the story's framing of a romance, never the character.

[protect-operatic-stakes] Keep the game's operatic non-romance stakes, including grand destinies, the fate of the world, battles, duty and sacrifice for a cause, and oaths to lords, causes and comrades.

[protect-earned-declarations] Do not change an earned declaration. Apply the earned test first.

[protect-affectionate-teasing] Keep affectionate teasing that does not treat same-sex attraction as shameful.

[exclude-queer-additions] Add no new romance, no queer addition, and no flirt retargeting.

[exclude-clumsy-lines] Do not rewrite a clumsy line that has no flagged trigger.
"""

[judge]
rubric = """
You judge one rewrite of a flagged line against its vanilla line. A change that touches any protected item below is rejected. Reject a rewrite that fails any check, and name the label it fails.

[minimal-fix] Reject a rewrite that changes more than the fix needs, or a touched line whose flagged trigger is still present. A rewrite passes only when it answers no to the reason question of its line.

[leave-for-plot] Reject a rewrite that changes a plot fact to fix a line. A line that needs a plot change to be fixed must stay vanilla, because the story must stay as written.

[u1-presumed-opposite-sex] A passing rewrite removes a presumption that another character's partner or future partner is of the opposite sex, or removes same-sex closeness treated as a joke, an insult or a threat. It keeps the sentiment. Reject a rewrite that keeps the presumption, or that drops the sentiment.

[first-person-desire] Reject a rewrite that changes a character's own wish for an opposite-sex partner. The u1-presumed-opposite-sex fix targets only a presumption imposed on another character, because the character's own straight desire is a trait.

[u2-romance-outranks] A passing rewrite keeps the romantic feeling and sizes it to the moment. It also treats romance-as-default framing the same way: being unpartnered is not presented as incomplete, and marriage is not presented as what a life is for, unless the line is earned or is the speaker's established trait. Reject a rewrite that deletes the feeling itself, or that leaves unearned romantic supremacy in place.

[earned] Read earned from the arc beats in your context. A declaration or stance is earned when the arc beats record a setup and an escalation beat between the same characters before the declaration, or when the stance is the speaker's established trait. Reject any rewrite of an earned line, because the story builds to it.

[u3-devotion-as-vow] A passing rewrite makes devotion to a romantic partner or love interest a choice between equals, with the same commitment and the same action. Reject a rewrite that changes the commitment or the action.

[romantic-partner-only] Reject a rewrite that changes an oath to a lord, a cause or a comrade under u3-devotion-as-vow. That rule covers devotion to a romantic partner or love interest only.

[u4-stake-through-other] A passing rewrite returns a woman's own goal, fear or worth to her. Reject a rewrite that leaves the stake routed through a man.

[u5-rivalry-over-one-person] A passing rewrite keeps the tension between the two women and makes it about them, not about the man. Reject a rewrite that removes the tension.

[no-invented-motive] Reject a rewrite of a u5-rivalry-over-one-person line that adds a motive the scene does not offer. When the scene offers no other motive, the line must stay vanilla.

[u6-overwrought-declaration] A passing rewrite of an unearned declaration is in adult register and keeps its sentiment. Reject a rewrite that drops the sentiment, or that keeps extreme, breathless or life-or-death terms.

[u7-gender-rule] A passing rewrite states the line neutrally, without what men or women may do, must do, or are like. Reject a rewrite that keeps a gender rule in the line, whether it states or plainly implies it.

[gender-rule-narrow] U7 touches only a line that states or plainly implies a gender rule. Reject any change to a line in which a character is vulnerable or protective, even when the line mentions a gender.

[protect-love-and-couples] Reject a rewrite that changes heterosexual attraction, a couple, a marriage, a promise, or who loves whom. Those are the story's relationships.

[protect-mutual-support] Reject a rewrite that removes or weakens characters supporting themselves or each other: a character relying on, helping, encouraging or drawing strength from another character. This protection wins over every rule, u4-stake-through-other included.

[protect-plot] Reject a rewrite that changes a plot fact: what happens, who does what, the decisions characters make, or the events of the scene.

[protect-traits] Reject a rewrite that changes a character trait, including a character's own straight desire. A flirt stays a flirt, so a rewrite that tones a flirt down is rejected.

[protect-operatic-stakes] Reject a rewrite that tones down the game's operatic non-romance stakes, because the story's grand moments are part of the original story.

[protect-earned-declarations] Reject a rewrite that changes an earned declaration. See earned.

[protect-affectionate-teasing] Reject a rewrite that removes teasing which does not treat same-sex attraction as shameful.

[exclude-queer-additions] Reject a rewrite that adds a new romance, adds a queer addition, or retargets a flirt. Those changes are out of scope for this lens.

[exclude-clumsy-lines] Reject a rewrite of a defect-free clumsy line. A clumsy line with no flagged trigger is out of scope.
"""

[scene]
criteria = [
    "[s1-manhood-performance] Flag s1-manhood-performance for the scene when a character ranks, polices or puts down a man as insufficiently manly: telling a man to be a man, saying what \"real men\" do or do not do, or ribbing a man as unmanly or girlish. The policing must recur in the scene (see recurring). Flag the scene for the pattern, not each line.",
    "[s2-conquest-fixation] Flag s2-conquest-fixation for the scene when its banter is dominated by getting with women: women treated as prizes or scores, and the ladies as a man's default topic of talk. Being dominated means getting with women is the main subject, not one topic among others (see presence-not-hit). The named hits conquest-coaching, minor-flirt and slapstick-rejection also flag the scene without that.",
    "[s3-bechdel-fail] Flag s3-bechdel-fail for the scene when two or more women talk with each other mainly about a man: his desirability, the attention he gets, the approval he earns, or whom he favors. If the women talk mainly about anything else, the pattern is not present. Judge the scene as a whole (see scene-not-line). Talk about a man as a plot actor is exempt (see plot-actor-exempt), and so is talk that advances her own goal (see own-goal-exempt).",
    "[recurring] s1-manhood-performance needs the policing to recur within the scene, not to appear in one line. A single line that polices a man's manhood does not flag s1-manhood-performance. Flag the pattern only when the scene holds more than one such line.",
    "[own-stance] A speaker's own stance about their own manhood is protected when the bible records it as a trait or an arc. A character saying what being a man means to them is not policing another character. Do not flag s1-manhood-performance for that stance when the bible records it as a trait or an arc.",
    "[male-warmth] Male friendship, affection, camaraderie and brotherhood are exempt from s1-manhood-performance. Men who tease each other warmly, show affection or stand by each other are not policing manhood, and that warmth is never stripped from the scene. Only ranking or policing a man as insufficiently manly flags the pattern.",
    "[presence-not-hit] For s2-conquest-fixation, women being present or mentioned is not a hit. A scene with women in it, or a line that names a woman, does not flag the pattern. Flag s2-conquest-fixation when getting with women is the scene's main subject, or when conquest-coaching, minor-flirt or slapstick-rejection applies.",
    "[trait-density] For s2-conquest-fixation, crush hints and flirting that the bible records as a trait are characterization, not a hit, unless they take over a conversation that has another purpose. Flag the scene only when they take over that conversation. Then the fix keeps the trait and cuts its density.",
    "[conquest-coaching] For s2-conquest-fixation, a man coaching another man on how to get women is a hit, even when the coaching takes up only part of the scene.",
    "[minor-flirt] For s2-conquest-fixation, flirting aimed at a minor or a child-looking character is a hit even when not recurring. One such line flags the pattern.",
    "[slapstick-rejection] For s2-conquest-fixation, a scene where a woman's only part is the slapstick rejection of a flirt is a hit. The fix gives her a line of her own, drawn from the scene's existing content (see own-line).",
    "[scene-not-line] Judge each pattern by the scene as a whole, never by a single line, except where a criterion names a single line as a hit (see minor-flirt). Flag the scene for the pattern, not the line that shows it.",
    "[plot-actor-exempt] For s3-bechdel-fail, talk about a man as a plot actor is exempt. Women discussing what a man did, chose, must do or is doing in the story is not the pattern. Flag s3-bechdel-fail only when the talk is about his desirability, attention, approval or whom he favors.",
    "[own-goal-exempt] For s3-bechdel-fail, talk that advances her own goal is exempt. This is the Mako Mori carve-out: a woman who talks about a man in order to pursue her own goal is not the pattern. Flag s3-bechdel-fail only when the talk stays on his desirability, attention, approval or whom he favors.",
]
plan = """
[plan-budget] Plan at most 4 changed lines per conversation. Count each line you plan to change, across the whole conversation, and stop planning once 4 lines are planned. A plan with 5 or more changed lines is out of budget and fails.

[required-optional] Mark each planned line required or optional. A required line is one the flagged pattern cannot be reduced without. An optional line would reduce the pattern further but is not needed to reduce it. Plan every required line first, and spend any budget left over on optional lines.

[line-pass-final] Never plan a line that the line pass changed or kept, for any reason. The line pass has decided those lines, and they stay as the line pass left them. Plan only from lines the line pass did not change or keep.

[keep-facts] Keep plot facts, relationships and traits. A planned change must not alter what happens, who does what, how two characters stand toward each other, or a character's trait. The plan changes the framing the pattern names, and nothing else.

[male-warmth] A planned change never strips warmth between men. Lines that show male friendship, affection, camaraderie or brotherhood stay as written. The plan works only on the ranking or policing of a man as insufficiently manly.

[trait-density] Where the bible records flirting or a crush as a trait, the plan keeps the trait and cuts its density. It softens or removes the flirt lines that take over a conversation with another purpose, and it leaves the trait visible elsewhere in the scene. The plan never removes the trait itself.

[own-line] An s2-conquest-fixation slapstick-rejection fix gives the woman a line of her own. The line is drawn from the scene's existing content and invents no topic (see no-invented-topic).

[no-invented-topic] Every fix, for every pattern, never invents a topic the scene does not offer. For s3-bechdel-fail, when the women talk mainly about a man, the fix may turn the talk toward a topic already present in the scene. It must not introduce a topic the scene does not offer. The same holds for the line of her own in an own-line fix.

[named-keep] When no plan within the budget reduces the flagged pattern, keep the scene unchanged and name one reason from exactly these five: protection, plot, trait, earned-arc, not-recurring. Name protection when a protection in the lens applies to the fix. Name plot when the fix needs a plot change. Name trait when a character trait holds the pattern. Name earned-arc when the arc beats earn the stance. Name not-recurring when the pattern does not recur in the scene.
"""
rubric = """
[reduce-pattern] Judge the plan as a whole. Pass a plan that reduces the flagged pattern while each speaker stays recognizable, with the same traits, voice and place in the story. Reject a plan that removes the pattern by flattening a speaker, making them bland, or changing who they are.

[keep-flirt-beat] For an s2-conquest-fixation plan, keep at least one flirt beat where the bible records flirting as a trait. A flirt beat is a line in which a character the bible records as flirting flirts. Reject an s2-conquest-fixation plan that leaves no flirt beat for such a character in the scene.

[no-wiser-women] Reject a plan that fills removed banter by turning the women into eye-rolling straight men for the men, the unbothered foils who sit out the men's jokes. This is the Women Are Wiser double standard: the women are made the sensible ones while the men keep the jokes. Reject that move whatever pattern the plan reduces.

[protections-hold] Every line-pass protection and exclusion still holds under the plan. Check protect-love-and-couples, protect-mutual-support, protect-plot, protect-traits, protect-operatic-stakes, protect-earned-declarations, protect-affectionate-teasing, exclude-queer-additions and exclude-clumsy-lines. Reject a plan that breaks any one of them, whatever pattern it reduces.
"""

[[scene.patterns]]
id = "s1-manhood-performance"
question = "A character in this scene ranks, polices or puts down a man as insufficiently manly, such as telling him to be a man or ribbing him as unmanly, and this recurs across the scene."

[[scene.patterns]]
id = "s2-conquest-fixation"
question = "The banter in this scene is dominated by getting with women, with women treated as prizes or scores and the ladies as a man's default topic of talk; or a man in this scene coaches another man on getting women, a character flirts with a minor or a child-looking character, or a woman's only part is the slapstick rejection of a flirt."

[[scene.patterns]]
id = "s3-bechdel-fail"
question = "Two or more women in this scene talk with each other mainly about a man's desirability, the attention he gets, the approval he earns, or whom he favors."
