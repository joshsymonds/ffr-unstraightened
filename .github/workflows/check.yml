name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Run just check
        run: devenv shell -- just check
